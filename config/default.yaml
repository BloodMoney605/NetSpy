# NetSpy configuration
# Override any value with --config /path/to/custom.yaml

target:
  threads: 20
  timeout: 10           # request timeout in seconds
  delay: 0              # delay between requests (ms)
  max_redirects: 5

recon:
  subdomains:
    wordlist: "subdomains-top1million.txt"
    sources:
      - crtsh
      - anubis
      - alienvault
      - wayback
    depth: 2
    resolver: "1.1.1.1"

scan:
  ports:
    top: 200            # scan top N ports (200 cubre ~90% de servicios comunes)
    rate: 1000          # packets per second (masscan)
  service_detect: true
  os_detect: false

fingerprint:
  http_probe: true
  extract_versions: true
  detect_waf: true
  whatweb_limit: 10       # max subdomains to scan with whatweb (heavy)
  screenshot: false       # requires gowitness

vuln:
  cve_db_path: "~/.netspy/cve.db"
  nuclei_templates: "~/.netspy/nuclei-templates"
  enable_nuclei: false    # nuclei consumes a LOT of memory; enable only if you have 4GB+ free
  severity_min: "medium"  # filter: info, low, medium, high, critical
  enable_checks:
    - cve
    - misconfig
    - exp

report:
  format: "txt"
  include_evidence: true
  open_browser: false
